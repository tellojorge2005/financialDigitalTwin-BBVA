name: financialDigitalTwin-BBVA
channels:
  - conda-forge
  - defaults
dependencies:
  # Base de Python
  - python=3.12.13
  - pip=26.1.2

  # Procesamiento de datos, ETL y AWS S3
  - boto3=1.43.98
  - botocore=1.43.100
  - numpy=2.5.2
  - pandas=2.3.3
  - pyarrow=25.0.0
  - pyspark=4.2.0
  - python-dotenv=1.2.2

  # Modelaje y simulacion
  - joblib=1.5.3
  - py-xgboost=3.2.0
  - scikit-learn=1.8.0
  - scipy=1.18.1

  # Aplicacion web, API y asistente IA (PRISMA y BI Chat)
  - email-validator=2.3.0
  - fastapi=0.141.1
  - httpx=0.28.1
  - itsdangerous=2.2.0
  - langchain=1.4.0
  - langchain-core=1.6.1
  - langchain-openai=1.6.0
  - langgraph=1.2.11
  - openai=2.53.0
  - pydantic=2.13.4
  - pydantic-settings=2.15.0
  - python-multipart=0.0.32
  - starlette=1.7.0
  - tiktoken=0.14.0
  - urllib3=2.7.0
  - uvicorn=0.53.0
  - uvicorn-standard=0.53.0

  # Notebooks, visualizacion y pruebas
  - ipykernel=7.3.0
  - ipympl=0.10.0
  - ipython=9.15.0
  - ipywidgets=8.1.8
  - matplotlib=3.11.1
  - mpld3=0.5.12
  - pytest=9.1.1

  - pip:
      - pandas-stubs==2.3.3.260113
      - pysocks==1.7.1