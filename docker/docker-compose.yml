services:

  postgres:
    image: postgres:18.6-trixie
    container_name: airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql

    networks:
      - spark-network


  airflow:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile

    container_name: airflow
    restart: unless-stopped

    depends_on:
      - postgres
      - spark-master

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

      S3_BUCKET: ${S3_BUCKET}

      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      PYSPARK_PYTHON: /opt/venv/bin/python

    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/opt/project/src
      - ../data:/opt/project/data

    ports:
      - "8080:8080"

    networks:
      - spark-network

    command:
      - bash
      - -ec
      - |
        umask 077
        python -c 'import json, os; from pathlib import Path; Path(os.environ["AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE"]).write_text(json.dumps({"admin": os.environ["AIRFLOW_ADMIN_PASSWORD"]}), encoding="utf-8")'
        exec airflow standalone


  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile

    container_name: spark-master
    restart: unless-stopped

    environment:
      SPARK_NO_DAEMONIZE: "true"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      PYSPARK_PYTHON: /opt/venv/bin/python

    volumes:
      - ../src:/opt/project/src
      - ../data:/opt/project/data

    ports:
      - "7077:7077"
      - "8081:8080"

    networks:
      - spark-network

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"


  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
      
    container_name: spark-worker
    restart: unless-stopped

    depends_on:
      - spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      PYSPARK_PYTHON: /opt/venv/bin/python

    volumes:
      - ../src:/opt/project/src
      - ../data:/opt/project/data

    ports:
      - "8082:8081"

    networks:
      - spark-network

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "2g"


networks:
  spark-network:
    driver: bridge


volumes:
  airflow-postgres-data: