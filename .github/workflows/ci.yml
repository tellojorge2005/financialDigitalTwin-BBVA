name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pyspark==4.0.4" \
            "numpy<3" \
            "pandas>=2.2,<3" \
            "scikit-learn>=1.3,<2" \
            pytest

      - name: Run tests
        run: |
          python -m pytest \
            tests/test_bronze_cleaning.py \
            tests/test_silver_cleaning.py \
            tests/test_gold_analysis.py \
            -v